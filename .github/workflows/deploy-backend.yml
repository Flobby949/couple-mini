name: Deploy backend

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="MYSQL_PWD=ci-only-password mysql -h 127.0.0.1 -u root -e 'SELECT 1'"
          --health-interval=5s --health-timeout=3s --health-retries=60
      redis:
        image: redis:8.8.0-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        env:
          TAG_CREATED: ${{ github.event.created }}
        run: |
          [[ "$TAG_CREATED" == true ]]
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend
        working-directory: backend
        env:
          INTEGRATION: "1"
          MYSQL_DSN: root:ci-only-password@tcp(127.0.0.1:3306)/?parseTime=true&loc=UTC&charset=utf8mb4
          REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -count=1 ./... && go vet ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/flobby949/couple-mini-backend:sha-${{ github.sha }}
            ghcr.io/flobby949/couple-mini-backend:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/Flobby949/couple-mini
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy image digest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" |
            ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 "root@$DEPLOY_HOST" "deploy $IMAGE_DIGEST"
